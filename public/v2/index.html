<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <!-- Pins the relative script/stylesheet refs below to the v2 folder. Without this, visiting
       /v2 without a trailing slash resolves them against the site root and loads the v1 bundle. -->
  <base href="/v2/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FlyTAP — Xperion Airways</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>✈️</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ink: { DEFAULT:'#0a0a0a', strong:'#232323', 700:'#3a3a3a', muted:'#6b6b6b', slate:'#667080', faint:'#9a9a9a' },
          tap: { red:'#ed1c24', green:'#46a41a', greenDeep:'#2e7d33', greenDark:'#336614' },
          lime: { DEFAULT:'#9efd38', alt:'#c7f21f', tint:'#f2ffdb' },
          surface: { DEFAULT:'#ffffff', soft:'#fafaf7', mute:'#f2f2ee', dark:'#0a0a0a', navy:'#1a1f29', navy2:'#1a1a2e' },
          line: { DEFAULT:'#e8e8e5', strong:'#dcdcd8', cool:'#e0e3e8' },
        },
        fontFamily: { sans:['Inter','system-ui','sans-serif'] },
        maxWidth: { page:'1440px', content:'1200px' },
        boxShadow: { card:'0 1px 2px rgba(10,10,10,.05),0 10px 30px rgba(10,10,10,.06)', pop:'0 12px 40px rgba(10,10,10,.16)' },
      }}
    }
  </script>
  <link href="./tokens.css" rel="stylesheet"/>
</head>
<body style="overflow-x:hidden;max-width:100vw">
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
